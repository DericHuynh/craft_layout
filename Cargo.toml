[package]
name = "keru_layout"
description = "UI layout library"
license = "MIT"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kekelp/keru_layout"
readme = "README.md"
categories = ["gui"]
keywords = ["gui", "ui", "layout"]
rust-version = "1.88"
exclude = [
    "examples/example.svg",
]

[features]
default = ["incremental"]
incremental = ["dep:arrayvec"]
batch-pilot = ["incremental"]

[dependencies]
slotmap = "1.0"
arrayvec = { version = "0.7", default-features = false, optional = true }

[dev-dependencies]
rand = "0.9"
roxmltree = "0.21"

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false
required-features = ["incremental"]

[[test]]
name = "incremental_fuzz"
required-features = ["incremental"]

[[bench]]
name = "real_workloads"
path = "benches/real_workloads/main.rs"
harness = false
required-features = ["incremental"]

[[example]]
name = "example"
required-features = ["incremental"]

[[example]]
name = "dispatch_board"
required-features = ["incremental"]

[[example]]
name = "maintenance_console"
required-features = ["incremental"]

[[example]]
name = "asset_browser"
required-features = ["incremental"]

[[example]]
name = "scoreboard"
required-features = ["incremental"]

[[bench]]
name = "grid_tracks"
harness = false
